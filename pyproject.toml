[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "record-for-agent-skill"
version = "0.2.0"
description = "Zero-API local transcription, speaker diarization, and context ingestion skill for Record for Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "sherpa-onnx>=1.10.30",
]

[project.scripts]
rfa-context = "scripts.rfa_context:main"

[tool.setuptools]
packages = ["scripts"]
